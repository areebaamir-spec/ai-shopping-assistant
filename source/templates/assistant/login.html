{% extends "base.html" %}
{% block title %}Log In — AI Shopping Assistant{% endblock %}
{% block content %}
    <section class="auth-form">
        <h1>Log in</h1>
        <form method="POST">
            {% csrf_token %}
            {% for error in form.non_field_errors %}
                <p class="field-error">{{ error }}</p>
            {% endfor %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{% url 'assistant:signup' %}">Sign up</a></p>
    </section>
{% endblock %}
